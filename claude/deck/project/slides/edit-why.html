<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#C2410C">06 · 活動編輯</p>
<h2 style="font-family:'LXGW WenKai TC', Georgia, serif;font-size:64px;font-weight:700;color:#1F2430;line-height:1.1">什麼時候需要編輯活動</h2>
</div>
<ul style="font-size:34px;line-height:1.75;color:#3A4150">
<li>上火車之後忘了停錶</li>
<li>想獨立出畫圖的那段活動（比如把騎去泰北高中以及從泰北高中騎回宿舍的部份從神掌的活動中獨立出來）</li>
<li>想獨立出比賽的那段活動（比如開賽前 10 秒就會先按錶，但是那 10 秒影響了 Strava 上看到的成績）</li>
<li>計時失敗</li>
<li>想把畫圖騎錯路的地方刪掉</li>
<li>活動分成了兩段紀錄，想合併成一個活動（比如騎到助航站之後很興奮就先上傳活動了，回去之後想把去程與回程的合併在一起）</li>
</ul>
</section>
