<section id="timing" style="background:#FAF8F5;color:#2B303B;font-family:'Noto Sans TC', Arial, sans-serif;padding:80px 112px;display:flex;flex-direction:column;gap:28px">
<div style="display:flex;flex-direction:column;gap:8px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#C2410C">04 · 路段</p>
<h2 style="font-family:'LXGW WenKai TC', Georgia, serif;font-size:64px;font-weight:700;color:#1F2430;line-height:1.1">計時原理</h2>
</div>
<div style="display:flex;gap:56px;align-items:start">
<div style="flex:1;display:flex;flex-direction:column;gap:22px">
<p style="font-size:30px;line-height:1.5;color:#1F2430;background:#FFFFFF;border:2px solid #E4DED6;border-radius:12px;padding:20px 28px">路段時間 = 通過終點的時間 − 通過起點的時間</p>
<div style="display:flex;flex-direction:column;gap:6px">
<p style="font-size:28px;font-weight:700;color:#C2410C">通過起／終點判定</p>
<p style="font-size:28px;line-height:1.5;color:#3A4150">活動：由一堆點（通常一秒一個）組成的一條折線</p>
<p style="font-size:28px;line-height:1.5;color:#3A4150">通過起／終點：這些點與起／終點距離的 local minimum，也就是在一個區間之內與起／終點距離最近的點</p>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<p style="font-size:28px;font-weight:700;color:#C2410C">計時狀態</p>
<p style="font-size:28px;line-height:1.5;color:#3A4150">通過起點之後，依序抵達路段中的各個點，並且未偏離路段太遠</p>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<p style="font-size:28px;font-weight:700;color:#C2410C">計時流程</p>
<p style="font-size:28px;line-height:1.5;color:#3A4150">通過起點 → 維持計時狀態 → 通過終點</p>
</div>
</div>
<div style="width:600px;display:flex;flex-direction:column;gap:12px">
<p style="font-size:28px;color:#3A4150">你以為的路段</p>
