<section id="fail-fix" style="background:#FAF8F5;color:#2B303B;font-family:'Noto Sans TC', Arial, sans-serif;padding:80px 112px;display:flex;flex-direction:column;gap:28px">
<div style="display:flex;flex-direction:column;gap:8px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#C2410C">04 · 路段</p>
<h2 style="font-family:'LXGW WenKai TC', Georgia, serif;font-size:64px;font-weight:700;color:#1F2430;line-height:1.1">如何避免計時失敗</h2>
</div>
<div style="display:flex;flex-direction:column">
<div style="display:flex;gap:40px;align-items:start;border-bottom:2px solid #E4DED6;padding:16px 0"><p style="width:560px;font-size:28px;line-height:1.5;color:#6B6F78;text-decoration:line-through">在起點休息了一會之後直接上山</p><p style="flex:1;font-size:28px;line-height:1.5;color:#1F2430">出發前先離開起點夠遠的一段距離，再重新進入起點重新開始計時</p></div>
<div style="display:flex;gap:40px;align-items:start;border-bottom:2px solid #E4DED6;padding:16px 0"><p style="width:560px;font-size:28px;line-height:1.5;color:#6B6F78;text-decoration:line-through">計時完直接停在終點等待其他隊友</p><p style="flex:1;font-size:28px;line-height:1.5;color:#1F2430">抵達終點之後先離開終點夠遠的一段距離，以確保計時結束</p></div>
<div style="display:flex;gap:40px;align-items:start;border-bottom:2px solid #E4DED6;padding:16px 0"><p style="width:560px;font-size:28px;line-height:1.5;color:#6B6F78;text-decoration:line-through">計時到一半折返找隊友</p><p style="flex:1;font-size:28px;line-height:1.5;color:#1F2430">折返時停錶，回到折返點再按錶繼續</p></div>
<div style="display:flex;gap:40px;align-items:start;border-bottom:2px solid #E4DED6;padding:16px 0"><p style="width:560px;font-size:28px;line-height:1.5;color:#6B6F78;text-decoration:line-through">計時途中岔出去其他地方再回來</p><p style="flex:1;font-size:28px;line-height:1.5;color:#1F2430">岔出去時停錶，回到出去的點再按錶繼續</p></div>
<div style="display:flex;gap:40px;align-items:start;border-bottom:2px solid #E4DED6;padding:16px 0"><p style="width:560px;font-size:28px;line-height:1.5;color:#6B6F78;text-decoration:line-through">騎不同條路</p><p style="flex:1;font-size:28px;line-height:1.5;color:#1F2430">基本上沒救</p></div>
<div style="display:flex;gap:40px;align-items:start;border-bottom:2px solid #E4DED6;padding:16px 0"><p style="width:560px;font-size:28px;line-height:1.5;color:#6B6F78;text-decoration:line-through">過山洞</p><p style="flex:1;font-size:28px;line-height:1.5;color:#1F2430">基本上沒救，所以創路段會盡量避免經過過長的山洞</p></div>
<div style="display:flex;gap:40px;align-items:start;padding:16px 0"><p style="width:560px;font-size:28px;line-height:1.5;color:#6B6F78;text-decoration:line-through">計時中按到暫停</p><p style="flex:1;font-size:28px;line-height:1.5;color:#1F2430">回到按暫停的點按錶繼續計時</p></div>
</div>
</section>
