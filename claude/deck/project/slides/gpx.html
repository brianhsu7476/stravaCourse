<ul style="font-size:28px;line-height:1.55;color:#3A4150">
<li>Strava 用來儲存一個活動的檔案格式，點選 Export GPX 可獲得一個活動的 .gpx 檔</li>
<li>自己的活動有經緯度、海拔、時間、功率、溫度、心率、踏頻，總之所有車錶有紀錄的東西</li>
<li>別人的活動只有經緯度、海拔</li>
<li>與 .xml 有相近的格式，可以使用 .xml 相關的 parser 來處理（例如 Python 的 <a href="https://docs.python.org/3/library/xml.etree.elementtree.html">xml.etree.ElementTree</a>），需注意 namespace 的處理</li>
