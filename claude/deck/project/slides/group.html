<p style="font-size:32px;line-height:1.5;color:#3A4150">如果 A 在某個活動中有 50% 以上的時間是在 B 的某個活動的附近，那 Strava 會在 A 的活動中說與 B 一起騎乘</p>
<p style="font-size:32px;line-height:1.5;color:#3A4150"><b>是否一起騎乘並不是對稱的</b>（在數學上的說法是並非等價關係）</p>
<p style="font-size:24px;color:#6B6F78">等價關係是指具有自反性、對稱性、遞移性的二元關係</p>
<p style="font-size:32px;line-height:1.5;color:#3A4150">舉例來說，A 的某個活動是跟了 B 的某個 24 小時的活動的最前面 8 小時（例如 B 騎一日台九而 A 騎一日北花），那在 A 的活動中會寫跟 B 一起騎乘，但是在 B 的活動中不會寫跟 A 一起騎乘</p>
