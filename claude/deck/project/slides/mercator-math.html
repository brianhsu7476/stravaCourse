<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#C2410C">03 · 外掛程式</p>
<h2 style="font-family:'LXGW WenKai TC', Georgia, serif;font-size:64px;font-weight:700;color:#1F2430;line-height:1.1">麥卡托投影：地圖能畫到多高？</h2>
</div>
<p style="font-size:36px;line-height:1.7;color:#3A4150">假設赤道畫在地圖上的寬度是 2π<i>r</i>，那畫到南北緯 θ 的地圖的高度就是</p>
<div style="background:#FFFFFF;border:2px solid #E4DED6;border-radius:16px;padding:40px 56px;display:flex;flex-direction:column;gap:24px">
<p style="font-family:'Times New Roman', serif;font-size:56px;color:#1F2430;text-align:center">2<i>r</i> · ln | sec θ + tan θ |</p>
<p style="font-family:'Times New Roman', serif;font-size:32px;color:#6B6F78;text-align:center">∫₀ᶿ  1 / cos <i>x</i>  d<i>x</i>  =  [ ln | sec <i>x</i> + tan <i>x</i> | ]₀ᶿ  =  ln | sec θ + tan θ |</p>
</div>
<p style="font-size:36px;line-height:1.7;color:#3A4150">所以正方形的地圖會畫到南北緯 <span style="color:#C2410C"><b>tan⁻¹( ½ (e^π + e^−π) ) ≈ 85.07 度</b></span></p>
</section>
