<ul style="font-size:28px;line-height:1.55;color:#3A4150">
<li><b>PR</b> (Personal Record) / <b>PB</b> (Personal Best)：個人（最佳）紀錄</li>
<li><b>皇冠</b>：在一個路段拿到總排第一名／女子第一名，拿到皇冠的稱為登山王 (KOM, King of Mountain)／登山女王 (QOM, Queen of Mountain)</li>
<li><b>獎盃</b>：在一個路段拿到總排前十名／女子前十名</li>
<li><b>Local Legend</b>：九十天內在一個路段騎過最多次的人</li>
</ul>
