<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#C2410C">04 · 路段</p>
<h2 style="font-family:'LXGW WenKai TC', Georgia, serif;font-size:64px;font-weight:700;color:#1F2430;line-height:1.1">排名</h2>
</div>
<div style="display:flex;gap:48px;align-items:start">
<ul style="flex:1;font-size:28px;line-height:1.6;color:#3A4150">
<li><b>年齡</b>：依年齡分組排名（比如我在 20 至 24 歲組）</li>
<li><b>體重</b>：依體重分組排名（比如我在 55 至 64 公斤組）</li>
<li><b>今年</b>：當年度的排名</li>
<li><b>今天</b>：當天的排名，如果不是太熱門的路段，通常可以在團騎拿來看各自的速度</li>
<li><b>正在追蹤</b>：你跟你正在追蹤的人之間的排名，比如如果追蹤新店奧特曼，那可能在大部分的路段名次都會往後一名</li>
<li><b>社團</b>：可以看自己的社內排名</li>
</ul>
